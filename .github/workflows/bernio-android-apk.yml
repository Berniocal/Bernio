name: Bernio Android APK (test)
on:
  push:
    branches:
      - android-apk-0.1
    paths:
      - '.github/workflows/bernio-android-apk.yml'
      - 'android/**'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract native Android project
        shell: bash
        run: |
          mkdir -p native
          base64 --decode android/build-source.tar.xz.b64 | tar -xJ -C native
          test -f native/app/src/main/java/cz/bernio/kalkulacka/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile installable Android APK
        working-directory: native
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp native/app/build/outputs/apk/debug/app-debug.apk Bernio-Android-0.1-test.apk
          sha256sum Bernio-Android-0.1-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bernio-Android-0.1-test-apk
          path: Bernio-Android-0.1-test.apk
          retention-days: 30

      - name: Publish test APK in GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create bernio-android-test-0.1.0 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Bernio Android 0.1 – testovací APK" \
            --notes "Testovací instalovatelné APK kalkulačky Bernio. 5× AC → QR START → přezdívka → systémové připnutí → test. Toto je testovací build podepsaný dočasným debug klíčem; určený k ověření na telefonu." \
            Bernio-Android-0.1-test.apk
